# Skopíruj ako config.local.yaml (git ho ignoruje) a doplň: hodnoty prepíšu config.yaml.
# Sem patria osobné údaje, ktoré nemajú byť v repozitári – najmä profil odosielateľa v pätičke oslovení.
outreach:
  sender:
    name: "{MENO_PRIEZVISKO}"
    email: "{EMAIL_ODOSIELATELA}"
    phone: ""                                   # voliteľné
    affiliation: "{AFILIACIA}"                  # iba ak je to pravda
    privacy_notice_url: "{URL_INFORMACIE_O_SPRACUVANI}"
    gender: ""                                  # "m" alebo "f" pre tvary „rád/rada by som“; prázdne = neutrálne vety
